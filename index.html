<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Colliers Business Card Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Loader language = the EN/FR choice the app saved (store.js writes colliers-v2.locale).
      ;(function () {
        var lang = 'en'
        try {
          lang = JSON.parse(localStorage.getItem('colliers-v2.locale')) === 'FR' ? 'fr' : 'en'
        } catch (e) {
          lang = 'en'
        }
        document.documentElement.lang = lang
      })()
    </script>
    <style>
      .loader [data-lang='fr'] {
        display: none !important;
      }
      html[lang='fr'] .loader [data-lang='en'] {
        display: none !important;
      }
      html[lang='fr'] .loader [data-lang='fr'] {
        display: block !important;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- Startup loader, same card as the Klai site spinner. Vue replaces #app when it mounts. -->
      <div
        class="loader"
        role="status"
        aria-live="polite"
        style="
          display: flex;
          align-items: center;
          justify-content: center;
          box-sizing: border-box;
          width: 100%;
          min-height: 100vh;
          padding: 16px;
          background: #f8f9fa;
          font-family:
            Inter,
            system-ui,
            -apple-system,
            'Segoe UI',
            sans-serif;
        "
      >
        <div
          style="
            box-sizing: border-box;
            width: 100%;
            max-width: 440px;
            padding: 56px 24px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
            align-items: center;
          "
        >
          <div
            aria-hidden="true"
            style="
              display: flex;
              align-items: center;
              justify-content: center;
              gap: 14px;
              margin-bottom: 48px;
              max-width: 100%;
            "
          >
            <img
              src="/src/assets/colliers-logo-mark.png"
              alt=""
              style="display: block; height: 56px; width: auto"
            />
            <img
              data-lang="en"
              src="/src/assets/lockup-words-en.png"
              alt=""
              style="display: block; height: 40px; width: auto; max-width: 100%"
            />
            <img
              data-lang="fr"
              src="/src/assets/lockup-words-fr.png"
              alt=""
              style="display: block; height: 40px; width: auto; max-width: 100%"
            />
          </div>
          <svg
            width="40"
            height="40"
            viewBox="0 0 48 48"
            aria-hidden="true"
            style="display: block; margin-bottom: 24px"
          >
            <circle cx="24" cy="24" r="18" fill="none" stroke="#e6eaf3" stroke-width="4"></circle>
            <g>
              <animateTransform
                attributeName="transform"
                type="rotate"
                from="0 24 24"
                to="360 24 24"
                dur="0.9s"
                repeatCount="indefinite"
              ></animateTransform>
              <circle
                cx="24"
                cy="24"
                r="18"
                fill="none"
                stroke="#25408f"
                stroke-width="4"
                stroke-linecap="round"
                stroke-dasharray="28 85"
              ></circle>
            </g>
          </svg>
          <p data-lang="en" style="margin: 0; font-size: 14px; line-height: 20px; color: #6b7280">
            Loading…
          </p>
          <p data-lang="fr" style="margin: 0; font-size: 14px; line-height: 20px; color: #6b7280">
            Chargement…
          </p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
