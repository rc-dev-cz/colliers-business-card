<header
  id="colliersUserHeader"
  class="colliers-site-header w-full"
  :class="app.header.role === 'admin' ? 'colliers-site-header--admin' : ''"
  :style="app.header.role === 'admin' ? { background: '#25408F', borderBottomColor: '#1A2E6E' } : null"
>
  <!-- Same container, padding and logo gap for user and admin, so the logo never moves between roles. -->
  <div class="colliers-header-inner mx-auto flex h-[64px] w-full items-stretch justify-between gap-4 sm:h-[72px]">
    <div class="flex h-full min-w-0 flex-1 items-stretch">
      <button
        type="button"
        class="flex shrink-0 items-center self-center focus:outline-none focus-visible:ring-2 sm:mr-8"
        :class="app.header.role === 'admin' ? 'focus-visible:ring-white' : 'focus-visible:ring-[#25408F]'"
        :aria-label="(app.currentLang || (app.i18n && app.i18n.langSelected) || 'en') === 'fr'
          ? 'Colliers Maîtres de projets'
          : 'Colliers Project Leaders'"
        @click="namedAction('goCatalog')"
      >
        <span
          class="colliers-header-lockup"
          :class="app.header.role === 'admin' ? 'colliers-header-lockup--on-blue' : ''"
          aria-hidden="true"
        >
          <img
            src="https://5t61ut5p19.ucarecd.net/66049ddf-e639-4104-9b94-5f1d96fc29a5/"
            alt=""
            class="colliers-header-mark"
          />
          <img
            :src="(app.currentLang || (app.i18n && app.i18n.langSelected) || 'en') === 'fr'
              ? 'https://5t61ut5p19.ucarecd.net/701d97ba-48e3-4b7b-a448-1ecee3b72a6e/'
              : 'https://5t61ut5p19.ucarecd.net/5c2ce46d-e9a5-441c-ad9a-8010efc9c9bf/'"
            :alt="(app.currentLang || (app.i18n && app.i18n.langSelected) || 'en') === 'fr'
              ? 'Maîtres de projets'
              : 'Project Leaders'"
            class="colliers-header-wordmark"
            :class="(app.currentLang || (app.i18n && app.i18n.langSelected) || 'en') === 'fr'
              ? 'colliers-header-wordmark--fr'
              : ''"
          />
        </span>
      </button>

      <nav v-if="app.header.role === 'admin'" class="colliers-admin-nav h-full min-w-0 flex-1 items-stretch">
        <div class="flex h-full min-w-0 flex-1 flex-wrap items-stretch">
          <button
            type="button"
            class="flex h-full items-center border-b-[3px] px-3 text-[13px] font-medium whitespace-nowrap lg:px-3.5 lg:text-sm"
            :class="app.header.activeNav === 'catalog'
              ? 'border-white text-white'
              : 'border-transparent text-white/70 hover:text-white'"
            @click="namedAction('goCatalog')"
          >{{ BF.i18n('label_general_catalogue') }}</button>
          <button
            type="button"
            class="flex h-full items-center border-b-[3px] px-3 text-[13px] font-medium whitespace-nowrap lg:px-3.5 lg:text-sm"
            :class="app.header.activeNav === 'admin-addresses'
              ? 'border-white text-white'
              : 'border-transparent text-white/70 hover:text-white'"
            @click="namedAction('goAdminAddresses')"
          >{{ BF.i18n('label_colliers_manageAddresses') }}</button>
          <button
            type="button"
            class="flex h-full items-center border-b-[3px] px-3 text-[13px] font-medium whitespace-nowrap lg:px-3.5 lg:text-sm"
            :class="app.header.activeNav === 'admin-titles'
              ? 'border-white text-white'
              : 'border-transparent text-white/70 hover:text-white'"
            @click="namedAction('goAdminTitles')"
          >{{ BF.i18n('label_colliers_manageTitles') }}</button>
          <button
            type="button"
            class="flex h-full items-center border-b-[3px] px-3 text-[13px] font-medium whitespace-nowrap lg:px-3.5 lg:text-sm"
            :class="app.header.activeNav === 'admin-degrees'
              ? 'border-white text-white'
              : 'border-transparent text-white/70 hover:text-white'"
            @click="namedAction('goAdminDegrees')"
          >{{ BF.i18n('label_colliers_manageDegrees') }}</button>
        </div>
      </nav>

      <nav v-else class="colliers-user-nav h-full min-w-0">
        <button
          type="button"
          class="flex h-[64px] items-center border-b-[3px] px-3 text-sm font-medium sm:h-[72px] sm:px-4"
          :class="app.header.activeNav === 'catalog'
            ? 'border-[#25408F] text-gray-900'
            : 'border-transparent text-gray-600 hover:text-gray-900'"
          @click="namedAction('goCatalog')"
        >{{ BF.i18n('label_general_catalogue') }}</button>
      </nav>
    </div>

    <div class="flex shrink-0 items-center gap-4 self-center sm:gap-6">
      <div class="flex items-center text-[14px] font-medium sm:text-[15px]">
        <button
          type="button"
          class="transition-colors focus:outline-none"
          :class="app.header.role === 'admin'
            ? ((app.currentLang || (app.i18n && app.i18n.langSelected) || 'en') === 'en'
              ? 'font-bold text-white'
              : 'text-white/70 hover:text-white')
            : ((app.currentLang || (app.i18n && app.i18n.langSelected) || 'en') === 'en'
              ? 'font-bold text-[#25408F]'
              : 'text-gray-500 hover:text-gray-900')"
          @click="namedAction('setLocale', { locale: 'en' })"
        >EN</button>
        <span
          class="mx-1.5 sm:mx-2"
          :class="app.header.role === 'admin' ? 'text-white/50' : 'text-gray-400'"
        >/</span>
        <button
          type="button"
          class="transition-colors focus:outline-none"
          :class="app.header.role === 'admin'
            ? ((app.currentLang || (app.i18n && app.i18n.langSelected) || 'en') === 'fr'
              ? 'font-bold text-white'
              : 'text-white/70 hover:text-white')
            : ((app.currentLang || (app.i18n && app.i18n.langSelected) || 'en') === 'fr'
              ? 'font-bold text-[#25408F]'
              : 'text-gray-500 hover:text-gray-900')"
          @click="namedAction('setLocale', { locale: 'fr' })"
        >FR</button>
      </div>

      <button
        type="button"
        class="relative rounded-sm transition-colors focus:outline-none focus:ring-2"
        :class="app.header.role === 'admin'
          ? 'text-white/90 hover:text-white focus:ring-white'
          : 'text-[#25408F] hover:text-[#1A2E6E] focus:ring-[#25408F]'"
        :aria-label="BF.i18n('label_general_activeCartPreview')"
        @click="namedAction('openCart')"
      >
        <svg class="h-6 w-6 sm:h-7 sm:w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 00-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 00-16.536-1.84M7.5 14.25L5.106 5.272M6 20.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm12.75 0a.75.75 0 11-1.5 0 .75.75 0 011.5 0z"
          />
        </svg>
        <span
          v-if="app.header.cartCount > 0"
          class="absolute -right-1 -top-1 flex h-4 w-4 items-center justify-center rounded-full text-[10px] font-bold"
          :class="app.header.role === 'admin' ? 'bg-white text-[#25408F]' : 'bg-red-500 text-white'"
        >{{ app.header.cartCount }}</span>
      </button>

      <div class="relative">
        <button
          type="button"
          class="flex h-9 w-9 items-center justify-center rounded-full transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 sm:h-11 sm:w-11"
          :class="app.header.role === 'admin'
            ? 'bg-white text-[#25408F] hover:bg-gray-100 focus:ring-white'
            : 'bg-[#25408F] text-white hover:bg-[#1A2E6E] focus:ring-[#25408F]'"
          :aria-label="BF.i18n('label_general_myAccount')"
          :aria-expanded="app.header.menuOpen ? 'true' : 'false'"
          @click="namedAction('toggleMenu')"
        >
          <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24">
            <path
              d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v1.2h19.2v-1.2c0-3.2-6.4-4.8-9.6-4.8z"
            />
          </svg>
        </button>

        <div
          v-if="app.header.menuOpen"
          class="absolute right-0 z-30 mt-2 w-52 overflow-hidden rounded-md border border-gray-200 bg-white py-2 shadow-lg"
        >
          <div class="border-b border-gray-100 px-3 pb-2 text-sm text-gray-600">
            {{ app.header.displayName || 'User' }}
          </div>
          <button
            v-if="app.header.role === 'admin'"
            type="button"
            class="w-full px-3 py-2 text-left text-sm hover:bg-gray-50"
            :class="app.header.activeNav === 'admin'
              ? 'bg-blue-50 font-medium text-[#25408F]'
              : 'text-gray-800'"
            @click="namedAction('goAdmin')"
          >{{ BF.i18n('label_colliers_adminDashboard') }}</button>
          <button
            type="button"
            class="w-full px-3 py-2 text-left text-sm hover:bg-gray-50"
            :class="app.header.activeNav === 'address-book'
              ? 'bg-blue-50 font-medium text-[#25408F]'
              : 'text-gray-800'"
            @click="namedAction('goAddressBook')"
          >{{ BF.i18n('label_general_addressBook') }}</button>
          <button
            type="button"
            class="w-full px-3 py-2 text-left text-sm hover:bg-gray-50"
            :class="app.header.activeNav === 'order-history'
              ? 'bg-blue-50 font-medium text-[#25408F]'
              : 'text-gray-800'"
            @click="namedAction('goOrderHistory')"
          >{{ BF.i18n('label_general_orderHistory') }}</button>
          <button
            type="button"
            class="mt-1 w-full px-3 py-2 text-left text-sm text-gray-800 hover:bg-gray-50"
            @click="namedAction('logoutOfApp')"
          >{{ BF.i18n('label_general_logout') }}</button>
        </div>
      </div>

      <button
        v-if="app.header.role === 'admin'"
        type="button"
        class="colliers-admin-menu-btn focus:outline-none focus-visible:ring-2 focus-visible:ring-white"
        :aria-label="BF.i18n('label_navMenu')"
        :aria-expanded="app.header.mobileMenuOpen ? 'true' : 'false'"
        @click="namedAction('toggleMobileMenu')"
      >
        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Opens from the right, next to the hamburger. -->
  <div
    v-if="app.header.role === 'admin' && app.header.mobileMenuOpen"
    class="fixed inset-0 z-50 flex justify-end lg:hidden"
    role="dialog"
    aria-modal="true"
    :aria-label="BF.i18n('label_colliers_adminDashboard')"
  >
    <button
      type="button"
      class="fixed inset-0 bg-black/50"
      :aria-label="BF.i18n('label_general_closeMenu')"
      @click="namedAction('closeMobileMenu')"
    ></button>
    <div class="relative flex h-full w-64 flex-col bg-[#25408F] px-4 pb-6 pt-6 text-white shadow-xl">
      <button
        type="button"
        class="absolute right-4 top-4 text-white hover:text-white/80 focus:outline-none focus-visible:ring-2 focus-visible:ring-white"
        :aria-label="BF.i18n('label_general_closeMenu')"
        @click="namedAction('closeMobileMenu')"
      >
        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
      <nav class="mt-8 flex flex-col">
        <button
          type="button"
          class="w-full border-b border-white/20 py-3.5 text-left text-[15px] font-medium"
          :class="app.header.activeNav === 'catalog' ? 'text-white' : 'text-white/80'"
          @click="namedAction('goCatalog')"
        >{{ BF.i18n('label_general_catalogue') }}</button>
        <button
          type="button"
          class="w-full border-b border-white/20 py-3.5 text-left text-[15px] font-medium"
          :class="app.header.activeNav === 'admin-addresses' ? 'text-white' : 'text-white/80'"
          @click="namedAction('goAdminAddresses')"
        >{{ BF.i18n('label_colliers_manageAddresses') }}</button>
        <button
          type="button"
          class="w-full border-b border-white/20 py-3.5 text-left text-[15px] font-medium"
          :class="app.header.activeNav === 'admin-titles' ? 'text-white' : 'text-white/80'"
          @click="namedAction('goAdminTitles')"
        >{{ BF.i18n('label_colliers_manageTitles') }}</button>
        <button
          type="button"
          class="w-full border-b border-white/20 py-3.5 text-left text-[15px] font-medium"
          :class="app.header.activeNav === 'admin-degrees' ? 'text-white' : 'text-white/80'"
          @click="namedAction('goAdminDegrees')"
        >{{ BF.i18n('label_colliers_manageDegrees') }}</button>
        <button
          type="button"
          class="w-full border-b border-white/20 py-3.5 text-left text-[15px] font-medium"
          :class="app.header.activeNav === 'admin' ? 'text-white' : 'text-white/80'"
          @click="namedAction('goAdmin')"
        >{{ BF.i18n('label_colliers_adminDashboard') }}</button>
        <button
          type="button"
          class="w-full border-b border-white/20 py-3.5 text-left text-[15px] font-medium"
          :class="app.header.activeNav === 'address-book' ? 'text-white' : 'text-white/80'"
          @click="namedAction('goAddressBook')"
        >{{ BF.i18n('label_general_addressBook') }}</button>
        <button
          type="button"
          class="w-full border-b border-white/20 py-3.5 text-left text-[15px] font-medium"
          :class="app.header.activeNav === 'order-history' ? 'text-white' : 'text-white/80'"
          @click="namedAction('goOrderHistory')"
        >{{ BF.i18n('label_general_orderHistory') }}</button>
      </nav>
    </div>
  </div>
</header>
