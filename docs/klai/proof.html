<div id="proof-root" class="colliers-page-root px-4 py-8 sm:px-6 lg:px-8">
  <div v-if="!model.product || !model.product.code || !model.proof || !model.proof.code" class="py-20 text-center text-gray-500">{{ BF.i18n('label_colliers_productNotFound') }}</div>
  <div v-else>
    <button type="button" class="mb-6 inline-flex items-center gap-1 text-sm text-gray-600 hover:text-gray-900" @click="BF.namedAction('goCustomize')">
      <span aria-hidden="true">&lsaquo;</span> {{ BF.i18n('label_colliers_back') }}
    </button>
    <div class="flex flex-col gap-10 lg:flex-row lg:items-start lg:gap-12">
      <div class="w-full min-w-0 lg:flex-[1.35]">
        <div class="colliers-split-head"><h2 class="text-lg font-bold text-[#25408F]">{{ BF.i18n('label_colliers_cardPreview') }}</h2></div>
        <div class="space-y-5">
          <div v-for="previewLang in (/bilingual|bilin/i.test(String((model.product && model.product.language) || (model.proof && model.proof.language) || '')) ? ['English','French'] : [((model.product && model.product.language) || (model.proof && model.proof.language) || 'English')])" :key="previewLang" class="card-preview-frame card-preview-frame--proof card-preview-frame--bleed">
            <div class="card-preview-bleed"><div id="colliersCardPreview" class="relative aspect-[1.75/1] w-full overflow-hidden rounded-md border border-gray-200 bg-white text-[#4A4A4A] shadow-sm" style="container-type: inline-size; font-family: 'Open Sans', sans-serif">
              <template v-for="c in [(model.proof && model.proof.details) || {}]"><template v-for="fr in [['French','Français','FR'].indexOf(previewLang) >= 0]"><template v-for="bil in [/bilingual|bilin/i.test(String((model.product && model.product.language) || (model.proof && model.proof.language) || ''))]">
                <img src="https://5t61ut5p19.ucarecd.net/66049ddf-e639-4104-9b94-5f1d96fc29a5/" alt="Colliers" class="absolute object-contain" style="left: 6.968%; bottom: 69.306%; width: 18.488%; height: 18.417%" />
                <img :src="fr ? 'https://5t61ut5p19.ucarecd.net/701d97ba-48e3-4b7b-a448-1ecee3b72a6e/' : 'https://5t61ut5p19.ucarecd.net/5c2ce46d-e9a5-441c-ad9a-8010efc9c9bf/'" :alt="fr ? 'Maîtres de projets' : 'Project Leaders'" class="absolute object-contain" :style="fr ? 'left: 27.873%; bottom: 70.347%; width: 18.044%; height: 15.083%' : 'left: 27.917%; bottom: 72.125%; width: 13.96%; height: 13.083%'" />
                <div v-for="(nameLine, nameIdx) in (c.nameLines && c.nameLines.length ? c.nameLines : [String(c.name || '').trim() || (fr ? 'Prénom Nom' : 'Firstname Lastname')])" :key="'name-' + nameIdx" class="absolute whitespace-nowrap font-bold leading-none text-[#03438C]" :style="'left: 41.28%; right: 2.56%; bottom: ' + ((c.previewNameYs && c.previewNameYs[nameIdx] != null) ? c.previewNameYs[nameIdx] : (46.17 + ((c.nameLines && c.nameLines.length ? c.nameLines.length : 1) - 1 - nameIdx) * 7.64)) + '%; font-size: 3.968cqw'"><span>{{ nameLine }}</span><span v-if="nameIdx === (c.nameLines && c.nameLines.length ? c.nameLines.length : 1) - 1 && c.inlineCredential" class="align-baseline font-bold" style="font-size: 0.7em">{{ c.inlineCredential }}</span></div>
                <div v-if="c.credentialLine" class="absolute whitespace-nowrap font-bold leading-none text-[#03438C]" :style="'left: 41.28%; right: 2.56%; bottom: ' + (c.previewCredY !== '' && c.previewCredY != null ? c.previewCredY : 40.27) + '%; font-size: 2.778cqw'">{{ c.credentialLine }}</div>
                <div class="absolute whitespace-nowrap leading-none text-[#5F636A]" :style="'left: 41.28%; right: 2.56%; bottom: ' + (c.previewTitleY != null ? c.previewTitleY : (String(c.specializedTeam || '').trim() && c.credentialLine ? 34.72 : 40.27)) + '%; font-size: ' + ((fr && bil && String(c.titleFr || '').trim() ? c.previewTitleFrSize : c.previewTitleSize) || '2.579cqw')">{{ ((fr && bil && String(c.titleFr || '').trim()) || String(c.title || '').split('|')[0].trim() || (fr ? 'Titre' : 'Title')) + (c.previewRegionMode === 'title' && String(c.region || '').trim() ? ' | ' + String(c.region).trim() : '') }}</div>
                <div v-if="String(c.specializedTeam || '').trim()" class="absolute whitespace-nowrap leading-none text-[#5F636A]" :style="'left: 41.28%; right: 2.56%; bottom: ' + (c.previewTeamY != null ? c.previewTeamY : (c.credentialLine ? 29.16 : 34.72)) + '%; font-size: 2.579cqw'">{{ String(c.specializedTeam).trim() + (c.previewRegionMode === 'team' && String(c.region || '').trim() ? ' | ' + String(c.region).trim() : '') }}</div>
                <div v-if="c.previewRegionMode === 'own' && String(c.region || '').trim()" class="absolute whitespace-nowrap leading-none text-[#5F636A]" :style="'left: 41.28%; right: 2.56%; bottom: ' + c.previewRegionY + '%; font-size: 2.579cqw'">{{ String(c.region).trim() }}</div>
                <div class="absolute whitespace-nowrap leading-none text-[#5F636A]" :style="'left: 41.28%; right: 2.56%; bottom: ' + (c.previewEmailY != null && c.previewEmailY !== '' ? c.previewEmailY : 23.61) + '%; font-size: 2.579cqw'">{{ String(c.email || '').trim() || (fr ? 'prenom.nom@colliersprojectleaders.com' : 'first.lastname@colliersprojectleaders.com') }}</div>
                <div class="absolute whitespace-nowrap leading-none text-[#5F636A]" :style="'left: 41.28%; right: 2.56%; bottom: ' + (c.previewPhoneY != null && c.previewPhoneY !== '' ? c.previewPhoneY : 18.06) + '%; font-size: 2.579cqw'">{{ c.displayPhone || c.phone || '555 555 5555' }}</div>
                <div class="absolute whitespace-nowrap leading-none text-[#5F636A]" :style="'left: 41.28%; right: 2.56%; bottom: ' + (c.previewWebY != null && c.previewWebY !== '' ? c.previewWebY : 12.5) + '%; font-size: 2.579cqw'">{{ fr ? (c.websiteFr || 'colliersprojectleaders.com/fr') : (c.website && c.website !== 'colliers.com/canada' ? c.website : 'colliersprojectleaders.com') }}</div>
                <div class="absolute overflow-hidden text-[#5F636A]" style="left: 7.14%; right: 58.72%; bottom: 12.5%; font-size: 2.579cqw; line-height: 1.230769"><div v-for="(addrLine, addrIdx) in (String(c.addressWrapped || c.printAddress || c.address || '').trim() ? String(c.addressWrapped || c.printAddress || c.address).replace(/\r\n/g, '\n').replace(/\r/g, '\n').trim().split('\n') : (fr ? [&quot;Nom de l'adresse&quot;, 'Unité, Rue', 'Ville, Province', 'Code postal, Pays'] : ['Address name', 'Unit, Street', 'City, Province', 'Postal Code, Country']))" :key="'addr-' + addrIdx" class="overflow-hidden whitespace-nowrap">{{ addrLine }}</div></div>
              </template></template></template>
            </div></div>
          </div>
        </div>
      </div>
      <div class="w-full min-w-0 lg:max-w-md lg:flex-1">
        <div class="colliers-split-head"><h1 class="colliers-page-title">{{ BF.i18n('label_colliers_proofApproval') }}</h1></div>
        <div class="mb-6 rounded-md border border-amber-200 bg-amber-50 px-4 py-4 text-sm text-amber-950">
          <p class="font-semibold text-red-800">{{ BF.i18n('label_colliers_proofNoticeLead') }}</p>
          <p class="mt-2 leading-relaxed text-amber-950">{{ BF.i18n('label_colliers_proofNotice') }}</p>
          <label class="mt-4 flex cursor-pointer items-start gap-3 rounded border border-amber-200 bg-white px-3 py-3 text-sm text-gray-800">
            <input class="mt-0.5 h-4 w-4 shrink-0" type="checkbox" v-model="model.approved" />
            <span>{{ BF.i18n('label_colliers_proofCheckbox') }}</span>
          </label>
        </div>
        <div class="flex w-full flex-col gap-3">
          <button type="button" class="btn-outline-soft w-full" :disabled="!model.approved" @click="BF.namedAction('addProofToCart')">{{ (app.editLineId || (app.proof && app.proof.editLineId) || model.editLineId) ? BF.i18n('label_colliers_updateCart') : BF.i18n('label_colliers_addToCart') }}</button>
          <button type="button" class="btn-primary w-full" :disabled="!model.approved" @click="BF.namedAction('continueToShipping')">{{ BF.i18n('label_colliers_continueToShipping') }}</button>
          <button type="button" class="proof-back-link" @click="BF.namedAction('goCustomize')"><span aria-hidden="true" class="mr-1">&lsaquo;</span>{{ BF.i18n('label_colliers_backToEdit') }}</button>
        </div>
      </div>
    </div>
  </div>
</div>
